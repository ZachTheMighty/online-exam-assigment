<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add a Student</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/options.css" />
  </head>
  <body>
    <main>
      <header>Please provide information for the student to be added</header>

      <form action="../php/student.php" method="POST">
        <label
          >Student name:
          <input type="text" autocomplete="off" name="name" required
        /></label>
        <label
          >ID:
          <input
            type="text"
            autocomplete="off"
            name="id"
            required
            pattern="\d{7}"
            placeholder="e.g. 1234567"
        /></label>
        <label
          >Username:
          <input type="text" autocomplete="off" name="username" required
        /></label>
        <label
          >Password:
          <input type="password" autocomplete="off" name="password" required
        /></label>
        <label><input type="submit" value="Add student" /></label>
      </form>
    </main>
  </body>
</html>
