<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add a Student</title>
    <link rel="stylesheet" href="questions/reset.css" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>Please provide information for the student to be added</header>

      <form action="student.php" id="add_student" method="POST">
        <label for="name"
          >Student name:
          <input type="text" autocomplete="off" name="name" required
        /></label>
        <label for="id"
          >ID: <input type="text" autocomplete="off" name="id" required
        /></label>
        <label for="username"
          >Username:
          <input type="text" autocomplete="off" name="username" required
        /></label>
        <label for="password"
          >Password:
          <input type="password" autocomplete="off" name="password" required
        /></label>
        <label for="grade"
          >Grade: <input type="text" autocomplete="off" name="grade" required
        /></label>
        <label for=""><input type="submit" value="Add student" /></label>
      </form>
    </main>
  </body>
</html>
