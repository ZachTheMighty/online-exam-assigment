<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Exam Login</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/header_footer.css" />
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <header>Student Portal</header>

    <main>
      <form action="php/student.php" method="post">
        <label for="username">
          Username: <input type="text" name="username" autocomplete="off" />
        </label>

        <label for="password">
          Password:
          <input type="password" name="password" autocomplete="off" />
        </label>

        <label for="login">
          <input type="submit" value="Login" name="login" />
        </label>
      </form>
    </main>

    <footer>
      <a
        href="https://github.com/ZachTheMighty/online-exam-assigment/tree/main"
        target="_blank"
        >Visit on Github</a
      >
    </footer>
  </body>
</html>
